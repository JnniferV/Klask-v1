
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> symfony/mercure-bundle ###
  mercure:
    ports:
      # Bindé sur localhost uniquement : jamais joignable depuis le LAN.
      # Sert au publish serveur→hub (PHP tourne sur l'hôte) ; le navigateur passe par `proxy`.
      - "127.0.0.1:8090:80"
###< symfony/mercure-bundle ###
