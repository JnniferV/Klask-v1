# enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        check_header: true   # repris de l'ex-ux_turbo.yaml — validation du jeton via en-tête
        # pas de 'logout' ici : le firewall a enable_csrf à null, donc aucun jeton n'est vérifié
        # à la déconnexion et aucun template n'en génère. L'y laisser laissait croire que la
        # protection était active, et activer enable_csrf casserait d'un coup les liens
        # <a href="/logout"> du header et du menu admin, qui ne portent pas de jeton
        stateless_token_ids:
            - submit
            - authenticate
